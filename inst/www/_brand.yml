color:
  palette:
    # Derived from default plotly discrete colors
    blue: "#1f77b4"
    orange: "#ff7f0e"
    green: "#2ca02c"
    red: "#d62728"
    purple: "#9467bd"
    pink: "#e377c2"
    teal: "#17becf"
    black: "#000"
    white: "#fff"
    gray: "#7f7f7f"
  primary: "#636EFA"
  secondary: "#636EFA"
  light: "#f3f3f3"
  dark: "#212529"

defaults:
  bootstrap:
    rules: |
      .navbar {
        --bslib-navbar-light-bg: var(--brand-blue);
        --bslib-navbar-dark-bg: var(--brand-blue);
        --bs-navbar-color: var(--brand-white);
      }
      .navbar-brand {
        background-color: var(--brand-blue);
        color: var(--brand-white);
      }
      .nav {
        --bs-nav-link-color: var(--brand-blue);
        --bs-nav-link-hover-color: var(--brand-blue);
        --bs-nav-link-disabled-color: var(--brand-blue);
         --bs-nav-pills-link-active-color: var(--brand-white);
        --bs-nav-pills-link-active-bg: var(--brand-blue);
      }
      .navbar-link {
        background-color: var(--brand-blue);
        color: var(--brand-white);
      }
      .bi-house-fill {
        color: var(--brand-white);
      }
      .bslib-card {
        border-color: var(--brand-blue) !important;
      }
      .popover-header {
        color: var(--brand-white);
        background-color: var(--brand-blue);
      }
      // Customise style of footer
      .footer {
        background-color: var(--brand-blue);
        color: var(--brand-white);
        text-align: center;
      }