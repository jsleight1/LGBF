# on:
#   schedule:
#     # Upload data to Azure blob every 6 months
#     - cron: "0 0 1 */6 *"

on:
  push:
    branches: [11-save-data-in-external-cloud-storage]

name: upload-data.yaml

permissions: read-all

jobs:
  upload-data:
    runs-on: ubuntu-24.04-arm
    container:
      image: docker.io/jsleight1/lgbf:development
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2.11.0
        with:
          r-version: '4.4.2'
          install-r: false

      - name: Add libPaths
        run: |
          echo -e '.libPaths(c("/usr/local/lib/R/site-library", "/usr/local/lib/R/library"))' > .Rprofile
        shell: bash

      - name: Upload data to Azure blob
        env:
          R_CONFIG_ACTIVE: production
          azure_storage_container: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          blob_account_url: ${{ secrets.BLOB_ACCOUNT_URL }}
          blob_account_key: ${{ secrets.BLOB_ACCOUNT_KEY }}
        working-directory: /home/app
        run: |
          devtools::load_all()
          save_lgbf_data()
        shell: Rscript {0}
